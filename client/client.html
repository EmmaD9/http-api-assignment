<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>
    const init = () => {
      const submitBtn = document.querySelector('#send');

      submitBtn.addEventListener('click', async (e) => {
        const pageSelect = document.querySelector('#page').value;
        const typeSelect = document.querySelector('#type').value;

        const response = await fetch(pageSelect, {
          method: 'GET',
          headers: {
            accept: typeSelect,
          }
        });


        switch (response.status) {
          case 200: //Success
            content.innerHTML = `<b>Success</b>`;
            break;
          case 400: //Bad Request
            content.innerHTML = `<b>Bad Request</b>`;
            break;
          case 404: //Not Found
            content.innerHTML = `<b>Not Found</b>`;
            break;
          default: //Anything Else
            content.innerHTML = `<p>Status Code not Implemented By Client</p>`;
            break;
        }

        const resText = await response.text();
        const contentType = response.headers.get('Content-Type');
        if (contentType === 'application/json') {
          const resObj = JSON.parse(resText);
          if (resObj.message) {
            content.innerHTML += `<p>Message: ${resObj.message}</p>`;
          }
        } else if (contentType === 'text/xml') {
          const resXML = new window.DOMParser().parseFromString(resText, 'text/xml');
          if (resXML.querySelector('message')) {
            content.innerHTML += `<p>Message: ${resXML.querySelector('message').textContent}</p>`;
          }
        }
      });
    };

    window.onload = init;
  </script>
</head>

<body>
  <section id="top">
    <h3>Status Code Tests</h3>
    <select id="page">
      <option value="/success">Success</option>
      <option value="/badRequest">Bad Request</option>
      <option value="/unauthorized">Unauthorized</option>
      <option value="/forbidden">Forbidden</option>
      <option value="/internal">Internal</option>
      <option value="/notImplemented">Not Implemented</option>
      <option value="/notFound">Not Found</option>
    </select>
    <select id="type">
      <option value="application/json">JSON</option>
      <option value="text/xml">XML</option>
    </select>
    <button id="send">Send</button>
  </section>
  <section id="content">
  </section>
</body>

</html>
